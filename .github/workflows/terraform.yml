name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Pipeline"
    runs-on: ubuntu-latest

    # Use specific permissions if using GCP Workload Identity Federation (recommended)
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      # 3. Initialize Terraform (connects to your GCS backend automatically)
      - name: Terraform Init
        run: terraform init

      # 4. Run Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 5. Run Terraform Plan (runs on both PRs and pushes)
      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false

      # 6. Run Terraform Apply (ONLY runs on merges to main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-press