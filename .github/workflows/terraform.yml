name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Pipeline"
    runs-on: ubuntu-latest

permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for Workload Identity Federation OIDC token exchange

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud via WIF (Keyless Auth)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'tf-cicd-sa@project-f2f5392b-abfa-4181-b85.iam.gserviceaccount.com'
          create_credentials_file: true

      # 3. Setup Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 5. Run Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 6. Run Terraform Plan
      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false

      # 7. Run Terraform Apply (ONLY runs on pushes to main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve